# Prevent Flyway from modifying the database during export
spring.flyway.enabled=false

# Do not create or modify the actual database
spring.jpa.hibernate.ddl-auto=none

# Generate SQL DDL from the JPA entity mappings
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create

# Save the generated SQL here
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=docs/orm-schema.sql

# Use the Java entity mappings as the source
spring.jpa.properties.jakarta.persistence.schema-generation.create-source=metadata

# Do not execute schema-generation commands against the database
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none