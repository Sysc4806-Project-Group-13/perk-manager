<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head>
    <title>User - Perk Manager</title>
</head>
<body>
<main>
    <section class="flex flex-col gap-6">
        <div class="flex flex-col gap-1">
            <h1 class="text-3xl font-semibold tracking-tight" th:text="${profileName}">username</h1>
            <p class="text-muted-foreground" th:if="${self}">
                This is you. <a th:href="@{/profile}">Go to your profile</a> to change your memberships.
            </p>
        </div>

        <div class="card">
            <header>
                <h2>Memberships</h2>
                <p>The cards and programs this user has.</p>
            </header>
            <section>
                <p th:if="${#lists.isEmpty(memberships)}" class="text-muted-foreground">
                    This user has not added any memberships yet.
                </p>
                <ul class="grid gap-2" th:unless="${#lists.isEmpty(memberships)}">
                    <li th:each="m : ${memberships}">
                        <strong th:text="${m.name}">Membership</strong>
                        <span class="text-sm text-muted-foreground" th:text="${m.description}"></span>
                    </li>
                </ul>
            </section>
        </div>

        <div>
            <a th:href="@{/users}" class="btn" data-variant="outline">Back to all users</a>
        </div>
    </section>
</main>
</body>
</html>
